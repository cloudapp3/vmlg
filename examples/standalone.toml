mode = "standalone"

[server]
listen = "0.0.0.0:8080"
title = "vmlg Looking Glass"
subtitle = "Tokyo Premium BGP Network Diagnostics"
default_locale = "en-US"
trusted_proxies = ["127.0.0.1/32", "::1/128"]
cors_origins = ["*"]
enable_metrics = true
# Optional Bearer token for /metrics (or set env VMLG_METRICS_TOKEN):
metrics_token = ""

[node]
id = "tyo-01"
name = "Tokyo · BGP Premium"
location = "Tokyo, JP"
region = "APAC"
provider = "Equinix TY8"
asn = "AS64512"
public_host = "tyo-lg.example.com"
tags = ["CN2 GIA", "CU 9929", "10Gbps"]

[guard]
allow_private_targets = false
# Uncomment for DN42 deployments:
# allowed_reserved_cidrs = ["172.20.0.0/14", "fd00::/8"]
blocked_cidrs = []
client_rpm = 30
client_burst = 10
target_rpm = 20
target_burst = 8
max_concurrent_probes = 8
max_concurrent_speedtest = 4

[probe]
ping_default_count = 4
ping_max_count = 10
ping_timeout_ms = 1500
ping_interval_ms = 350
mtr_default_cycles = 5
mtr_max_cycles = 10
mtr_max_hops = 30
# DNS dig query timeout in milliseconds (500-15000)
dig_timeout_ms = 5000
# HTTP probe timeout in milliseconds (1000-30000)
http_timeout_ms = 10000
enable_dns_asn = true
enable_ptr = true

[node_status]
# Publish coarse load/memory metrics on node cards and /api/v1/nodes.
# false = only online/offline flag and version are exposed publicly.
public = true
# Load sparkline sampling interval in seconds (5-60, default 15, keeps 1h in memory).
sample_seconds = 15

[rpki]
# Optional Routinator-compatible validity API for the BGP route panel
# (e.g. "http://127.0.0.1:8323" or a public instance). Empty = feature absent.
# routinator_url = "http://127.0.0.1:8323"
# Validity query timeout in milliseconds (500-3000, hard-capped at 3s).
timeout_ms = 3000

[speedtest]
enabled = true
max_rate_mbps = 0 # 0 = unlimited; set e.g. 500 to cap per-stream rate at 500 Mbps
max_download_bytes = 268435456
max_upload_bytes = 134217728
test_files = ["10MB.bin", "100MB.bin", "1GB.bin"]

[iperf3]
enabled = true
binary = "iperf3"
port_start = 5201
port_end = 5210
lease_seconds = 120
max_active = 4

[bgp]
enabled = false
driver = "bird" # bird | frr | gobgp | mock
router_asn = "AS64512"
bird_socket = "/run/bird/bird.ctl"

[bgp.communities]
"64512:100" = "Customer Route"
"64512:200" = "IXP Peer"
"64512:1000:1" = "HKIX Learned"
