version: 2

project_name: vmlg

builds:
  - id: vmlg
    main: ./cmd/vmlg
    binary: vmlg
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/cloudapp3/vmlg/internal/version.Version={{.Version}}
      - -X github.com/cloudapp3/vmlg/internal/version.Commit={{.Commit}}
      - -X github.com/cloudapp3/vmlg/internal/version.BuildTime={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: cloudapp3
    name: vmlg
  draft: false
  prerelease: auto
  mode: replace

nfpms:
  - id: packages
    package_name: vmlg
    maintainer: cloudapp3
    description: Single-binary multi-node Network & BGP Looking Glass portal
    homepage: https://github.com/cloudapp3/vmlg
    license: MIT
    formats:
      - deb
      - rpm
    contents:
      - src: ./LICENSE
        dst: /usr/share/licenses/vmlg/LICENSE
